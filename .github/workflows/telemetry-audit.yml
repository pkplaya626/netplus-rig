name: 'Telemetry Audit and Nightly 11:59 PM Proctor'

on:
  schedule:
    # 23:59 EDT is 03:59 UTC
    - cron: '59 3 * * *'
  push:
    branches:
      - main
    paths:
      - 'artifacts/**'
      - 'data/**'
      - 'telemetry/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Proctor Audit
        id: run_audit
        continue-on-error: true
        run: python scripts/audit.py

      - name: Handle Audit Failure (DNF Alert)
        if: steps.run_audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, subprocess
          try:
              res = json.load(open('telemetry/last_audit_result.json', encoding='utf-8'))
              day = res.get('day', 1)
              errs = '\n'.join(['- ' + e for e in res.get('errors', [])])
              title = f'🚨 DNF ALERT: Sprint Failed on Day {day}'
              body = f'## 🚨 11:59 PM Proctor Audit Failure\n\nDaily automated synthesis and telemetry check failed for **Day {day}** at 23:59 EDT.\n\n### Violation Diagnostics:\n{errs}\n\n### Enforcement Action:\n- Day {day} marked RED (DNF)\n- Consecutive streak reset to 0\n- Status updated in telemetry/streak.json and README.md'
              subprocess.run(['gh', 'issue', 'create', '--title', title, '--body', body, '--label', 'dnf-alert'], check=False)
          except Exception as e:
              print(f'Error creating DNF issue: {e}')
          "

      - name: Re-Render Dynamic README Dashboard
        run: python scripts/update_readme.py

      - name: Commit and Push Telemetry and README Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add telemetry/streak.json telemetry/last_audit_result.json README.md
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(telemetry): update 11:59 PM proctor telemetry, streak matrix, and README [skip ci]"
            git push
          else
            echo "No telemetry changes to commit."
          fi

      - name: Proctor Exit Status Check
        if: steps.run_audit.outcome == 'failure'
        run: |
          echo "Proctor audit flagged DNF violations."
          exit 1
