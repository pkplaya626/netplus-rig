name: Deploy Training Rig to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'data/**'
      - 'telemetry/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Static Site Assets
        run: |
          mkdir -p app/data app/telemetry
          cp -r data/* app/data/
          cp -r telemetry/* app/telemetry/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './app'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
